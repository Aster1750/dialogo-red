/* Layout: one fixed-scale GBA-style screen. The dialog box sits at the bottom with the YES/NO menu above it on the right;
   a blue FireRed "help bar" underneath holds the controls (text, border style, saved lines).
   Single committed look (FireRed overworld), so no dark theme: every color is set explicitly. */
:root{
  --grass:#90d194;
  --ink:#2c2c34;
  --ink-shadow:#b0b0ba;
  --paper:#fffffe;
  --help:#1a5fb4;
  --help-edge:#0b3877;
  --help-hi:#9cc3f7;
  --gold:#f5c93b;
  --font-ui:'Pixelify Sans','Courier New',ui-monospace,monospace;
  --u:3px;      /* one GBA pixel in CSS px, set by script */
  --bw:4;       /* border thickness in GBA pixels, set by script */
  --cursor:none;
  --arrow:none;
  --tile:none;
}
html,body{height:100%}
body{
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--grass);color:var(--ink);
  font-family:var(--font-ui);
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;margin:0;padding:0;border:0;background:none;cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* ---------- stage ---------- */
.stage{
  flex:1 1 auto;min-height:0;position:relative;overflow:hidden;
  display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
  padding:12px 16px;
  background-color:var(--grass);
  background-image:var(--tile);
  background-size:calc(var(--u)*16) calc(var(--u)*16);
  image-rendering:pixelated;
}

<script>
(function(){

  };

  /* ----- border styles: rings from the outside in, [color, thickness in GBA px]; a color pair makes a dotted ring ----- */
  const K = '#303038';
  const STYLES = [
    { n:'Vermelha', r:[[K,1],['#e03c30',2],['#f8a8a0',1]] },
    { n:'Laranja',  r:[[K,1],['#f08020',2],['#f8d090',1]] },
    { n:'Arco-íris',r:[[K,1],['#e03c30',1],['#f8c020',1],['#38b050',1],['#3868e0',1]] },
    { n:'Verde',    r:[[K,1],['#30a050',2],['#a0e0a8',1]] },
    { n:'Azul',     r:[[K,1],['#3868d8',2],['#a0c0f8',1]] },
    { n:'Roxa',     r:[[K,1],['#7850c0',2],['#c8b0f0',1]] },
    { n:'Rosa pontilhada', r:[['#4a3a68',1],[['#f070a8','#ffffff'],2],['#f8c0d8',1]] },
    { n:'Dourada',  r:[[K,1],['#c89818',2],['#f8e078',1]] },
    { n:'Aço',      r:[['#202028',1],['#707080',2],['#c0c0cc',1]] },
    { n:'Preto e branco', r:[['#101018',3]] }
  ];
  const DEFAULT_PHRASES = [
    'Quer tirar uma foto comigo?',
    'Posso pegar uma bebida?',
    'Quer batalhar?',
    'Onde fica o banheiro?',
    'Obrigado!'

  const state = {
    text: String(store.get('text', DEFAULT_PHRASES[0])),
    style: store.get('style', 0),
    sel: store.get('sel', 0) === 1 ? 1 : 0,
    bg: store.get('bg', 0),
    sfx: store.get('sfx', store.get('sound', true) === false ? 0 : 1),
    txtSnd: store.get('txtsnd', true) !== false,
    phrases: store.get('phrases', DEFAULT_PHRASES.slice()),
    open: store.get('open', true) !== false
  };
  if (!(state.style >= 0 && state.style < STYLES.length)) state.style = 0;
  if (!Array.isArray(state.phrases)) state.phrases = DEFAULT_PHRASES.slice();

  /* ----- pixel art helpers ----- */
  function glyphURL(w, h, draw){

  const BGS = [
    { n:'Grama', base:'#90d194', draw(g){
      px(g, '#a8e4a8', [[2,3],[10,1],[6,10],[13,12],[1,13],[9,6]], 2, 1);
      px(g, '#78bd80', [[3,4],[11,2],[7,11],[14,13],[2,14],[10,7]]);
    } },
    { n:'Água', base:'#5aa8ee', draw(g){
      px(g, '#9ad0fa', [[2,3],[9,3],[6,11],[13,11]], 3, 1);
      px(g, '#4a90d8', [[5,7],[12,7],[1,15],[8,15]], 3, 1);
    } },
    { n:'Areia', base:'#e8d29a', draw(g){
      px(g, '#d4b878', [[2,3],[10,2],[5,9],[13,11],[1,13],[8,14]]);
      px(g, '#f4e4b4', [[6,4],[12,6],[3,11],[10,12]], 2, 1);
    } },
    { n:'Neve', base:'#eef6fc', draw(g){
      px(g, '#cfe2f2', [[2,3],[10,1],[6,10],[13,12],[1,13],[9,6]], 2, 1);
      px(g, '#ffffff', [[5,5],[12,9],[3,13],[9,14]]);
    } },
    { n:'Noite', base:'#2a4466', draw(g){
      px(g, '#3a5a82', [[2,3],[10,1],[6,10],[13,12],[1,13],[9,6]], 2, 1);
      px(g, '#1e3250', [[3,4],[11,2],[7,11],[14,13],[2,14],[10,7]]);
      px(g, '#f8f0b0', [[14,3]]);
    } },
    { n:'Caverna', base:'#6e665e', draw(g){
      px(g, '#58514a', [[1,2],[8,1],[4,8],[12,6],[2,13],[10,12]], 3, 2);
      px(g, '#8a8279', [[5,3],[12,3],[8,9],[1,9],[13,14]], 2, 1);
    } },
    { n:'Madeira', base:'#c99a5a', draw(g){
      px(g, '#a67a40', [[0,7],[0,15]], 16, 1);
      px(g, '#a67a40', [[5,0],[11,8]], 1, 7);
      px(g, '#dcb27a', [[0,0],[0,8]], 16, 1);
    } },
    { n:'Centro Pokémon', base:'#f6c8d4', draw(g){
      px(g, '#eeaabf', [[0,0],[8,8]], 8, 8);
      px(g, '#e090aa', [[0,7],[0,15]], 16, 1);
      px(g, '#e090aa', [[7,0],[15,0]], 1, 16);
    } },
    { n:'Lava', base:'#c4351f', draw(g){
      px(g, '#f08a22', [[2,3],[9,9],[12,2]], 3, 2);
      px(g, '#8c1c10', [[7,2],[3,10],[13,12]], 2, 2);
    } },
    { n:'Preto', base:'#0b0b12', draw(g){ px(g, '#16161f', [[3,3],[11,11]]); } }
  ];
  const tiles = [];
  function tile(i){
    if (!tiles[i]){
      const c = document.createElement('canvas'); c.width = c.height = 16;
      const g = c.getContext('2d');
      g.fillStyle = BGS[i].base; g.fillRect(0, 0, 16, 16);

      tiles[i] = c;

  }

  const CORNER = [[], [1], [2, 1]];
  function cut(g, x, y, w, h, r){
    const c = CORNER[r];

      const d = Math.min(j, h - 1 - j);
      const ind = d < c.length ? c[d] : 0;
      if (w - 2 * ind > 0) g.fillRect(x + ind, y + j, w - 2 * ind, 1);

  }
  function checker(c1, c2){
    const c = document.createElement('canvas'); c.width = c.height = 2;
    const g = c.getContext('2d');
    g.fillStyle = c1; g.fillRect(0, 0, 2, 2);
    g.fillStyle = c2; g.fillRect(0, 0, 1, 1); g.fillRect(1, 1, 1, 1);
    return c;
  }
  function paint(cv, w, h, st){
    cv.width = w; cv.height = h;
    const g = cv.getContext('2d');
    let o = 0;
    st.r.forEach(([c, t], i) => {
      g.fillStyle = Array.isArray(c) ? g.createPattern(checker(c[0], c[1]), 'repeat') : c;
      cut(g, o, o, w - 2 * o, h - 2 * o, i === 0 ? 2 : 1);
      o += t;

    g.fillStyle = '#fffffe';
    cut(g, o, o, w - 2 * o, h - 2 * o, 1);
  }

  /* ----- sizing: one GBA pixel = U css px, so the whole screen scales as a unit ----- */
  const stage = $('stage'), board = $('board'), dialog = $('dialog');
  let U = 3;
  function fit(){
    const cs = getComputedStyle(stage);
    const aw = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    const ah = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    const dpr = window.devicePixelRatio || 1;
    let u = Math.min(aw / 120, ah / 84);
    U = Math.max(2, Math.floor(u * dpr) / dpr);
    root.style.setProperty('--u', U + 'px');
    board.style.width = Math.max(96, Math.floor(aw / U)) * U + 'px';
    repaint();
  }
  function repaint(){
    document.querySelectorAll('.frame').forEach(f => {
      paint(f.querySelector('canvas.bg'),
        Math.max(8, Math.round(f.offsetWidth / U)),
        Math.max(8, Math.round(f.offsetHeight / U)),
        STYLES[state.style]);
    });
  }

  /* ----- dialog text with typewriter ----- */
  const txt = $('txt'), more = $('more');
  let chars = [], timer = 0, blank = false;
  function setText(t, animate){
    blank = false;
    clearTimeout(timer);
    txt.textContent = '';
    chars = [];
    t.split(/(\s+)/).forEach(p => {
      if (!p) return;
      if (/^\s+$/.test(p)) { txt.appendChild(document.createTextNode(' ')); return; }

        const s = document.createElement('span');
        s.className = 'c'; s.textContent = ch;
        txt.appendChild(s); chars.push(s);
      }

    if (!animate || reduce){
      chars.forEach(s => s.classList.add('on'));
      more.hidden = !chars.length;
      return;
    }
    let i = 0;
    (function tick(){
      if (i < chars.length){ chars[i++].classList.add('on'); textBlip(); timer = setTimeout(tick, 34); }
      else more.hidden = false;
    })();
  }
  /* tap the box: first tap wipes the line away letter by letter, next tap types the last chosen line again */
  function toggleText(){
    if (blank){ setText(state.text, true); return; }
    clearTimeout(timer);
    blank = true;
    more.hidden = true;
    const shown = chars.filter(s => s.classList.contains('on'));
    if (reduce || !shown.length){ txt.textContent = ''; chars = []; return; }
    const step = Math.max(6, Math.min(22, 300 / shown.length));
    (function erase(){
      const s = shown.pop();
      if (s){ s.classList.remove('on'); timer = setTimeout(erase, step); }
      else { txt.textContent = ''; chars = []; }
    })();
  }

  dialog.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleText(); }
  });

  /* ----- sound: GBA-style pulse-wave blips (move, confirm); four flavours, picked with the SOM button ----- */
  /* f = Hz, t = start (s), d = length (s), v = volume, w = pulse width; step = chip-style stepped decay */
  const SFX = [
    { move:[{f:1046.5,d:.055,v:.09,w:.25}],
      ok:[{f:1046.5,d:.06,v:.1,w:.25},{f:1568,t:.065,d:.17,v:.1,w:.25}] },
    { step:1, move:[{f:1760,d:.04,v:.08,w:.125}],
      ok:[{f:1760,d:.045,v:.08,w:.125},{f:2349.3,t:.05,d:.13,v:.08,w:.125}] },
    { step:1, move:[{f:1318.5,d:.07,v:.06,w:.5}],
      ok:[{f:1318.5,d:.05,v:.06,w:.5},{f:1975.5,t:.055,d:.14,v:.06,w:.5}] },
    { step:1, move:[{f:784,d:.05,v:.08,w:.25}],
      ok:[{f:784,d:.05,v:.08,w:.25},{f:1174.7,t:.055,d:.13,v:.08,w:.25}] }
  ];
  let actx = null;
  const waves = {};
  function wave(w){
    if (!waves[w]){
      const n = 24, re = new Float32Array(n + 1), im = new Float32Array(n + 1);
      for (let k = 1; k <= n; k++){
        re[k] = Math.sin(2 * Math.PI * k * w) / (k * Math.PI);
        im[k] = (1 - Math.cos(2 * Math.PI * k * w)) / (k * Math.PI);
      }
      waves[w] = actx.createPeriodicWave(re, im);
    }
    return waves[w];
  }
  function audio(){
    if (!actx){
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;

    return actx;

  function note(n, stepped, out){

    } else {
      g.gain.setValueAtTime(n.v, t0 + n.d * 0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);
    }

    o.start(t0); o.stop(t0 + n.d + 0.02);
  }
  function play(kind){
    if (!state.sfx || !audio()) return;
    const s = SFX[state.sfx - 1];
    s[kind].forEach(n => note(n, s.step));
  }
  document.addEventListener('pointerdown', () => { if (state.sfx) audio(); }, { passive: true });

  /* ----- fun effects (SONS row): chiptune takes on evolution, ball capture, victory and defeat ----- */
  const HZ = s => 523.25 * Math.pow(2, s / 12);          /* semitones above C5 */
  function noise(n, out){
    const t0 = actx.currentTime + (n.t || 0);
    const len = Math.ceil(actx.sampleRate * n.d);
    const buf = actx.createBuffer(1, len, actx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = actx.createBufferSource(); src.buffer = buf;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
    bp.frequency.setValueAtTime(n.f, t0);
    bp.frequency.exponentialRampToValueAtTime(n.f2, t0 + n.d);
    const g = actx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(n.v, t0 + n.d * 0.3);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + n.d);
    src.connect(bp); bp.connect(g); g.connect(out || actx.destination);
    src.start(t0);
  }
  const FX = [
    { n:'EVOLUÇÃO', make(){
      const out = [], sc = [0, 2, 4, 7, 9];
      let t = 0;
      for (let i = 0; i < 15; i++){                      /* climbing sparkle that speeds up */
        const gap = 0.2 - i * 0.01;
        out.push({ f: HZ(sc[i % 5] + 12 * Math.floor(i / 5)), t, d: gap * 1.5, v: .06, w: .25 });
        t += gap;
      }
      t += 0.06;
      [12, 16, 19, 24].forEach(s => out.push({ f: HZ(s), t, d: .9, v: .05, w: .125, s: 1 }));
      for (let i = 0; i < 6; i++) out.push({ f: HZ(i % 2 ? 26 : 24), t: t + .1 + i * .07, d: .06, v: .04, w: .5 });
      return out;
    } },
    { n:'POKÉBOLA', make(){
      return [
        { noise: 1, f: 500, f2: 3000, t: 0, d: .4, v: .22 },
        { f: 1400, f2: 300, t: .45, d: .12, v: .08, w: .5 },
        { f: 330, f2: 220, t: .95, d: .07, v: .1, w: .5 },
        { f: 330, f2: 220, t: 1.5, d: .07, v: .1, w: .5 },
        { f: 330, f2: 220, t: 2.05, d: .07, v: .1, w: .5 },
        { f: HZ(7), t: 2.6, d: .08, v: .08, w: .25 },
        { f: HZ(12), t: 2.69, d: .08, v: .08, w: .25 },
        { f: HZ(19), t: 2.78, d: .4, v: .08, w: .25, s: 1 }
      ];
    } },
    { n:'VITÓRIA', make(){
      const lead = [[7, 0, .09], [7, .11, .09], [7, .22, .09], [12, .33, .32], [9, .7, .12], [12, .84, .12], [16, 1, .7]];
      const out = [];
      lead.forEach(([s, t, d]) => out.push({ f: HZ(s), t, d, v: .07, w: .25 }));
      lead.forEach(([s, t, d]) => out.push({ f: HZ(s) / 2, t, d, v: .05, w: .5 }));
      [19, 24].forEach(s => out.push({ f: HZ(s), t: 1, d: .7, v: .04, w: .125, s: 1 }));
      return out;
    } },
    { n:'DERROTA', make(){
      return [
        { f: HZ(-1), t: 0, d: .2, v: .07, w: .5 },
        { f: HZ(-2), t: .24, d: .2, v: .07, w: .5 },
        { f: HZ(-3), t: .48, d: .2, v: .07, w: .5 },
        { f: HZ(-5), f2: HZ(-12), t: .75, d: .9, v: .07, w: .5 }
      ];
    } }
  ];
  const fxs = $('fxs');
  let fxBus = null, fxTimer = 0;
  function playFx(i, btn){
    if (!audio()) return;
    if (fxBus){ try { fxBus.disconnect(); } catch(e){} }
    fxBus = actx.createGain(); fxBus.connect(actx.destination);
    const notes = FX[i].make();
    notes.forEach(n => n.noise ? noise(n, fxBus) : note(n, n.s, fxBus));
    fxs.querySelectorAll('.fxb.on').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    clearTimeout(fxTimer);
    fxTimer = setTimeout(() => btn.classList.remove('on'), Math.max(...notes.map(n => (n.t || 0) + n.d)) * 1000);
  }
  FX.forEach((f, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'fxb'; b.textContent = f.n;
    b.addEventListener('click', () => playFx(i, b));
    fxs.appendChild(b);
  });

  /* ----- text sound: soft blip, every second letter, only once the audio has been unlocked by a tap ----- */
  let blipN = 0;
  function textBlip(){
    if (!state.txtSnd || !state.sfx || !actx || actx.state !== 'running') return;
    const k = blipN++;
    if (k % 2) return;
    note({ f: (k >> 1) % 2 ? 740 : 880, d: .022, v: .035, w: .5 }, false);
  }
  const txtSnd = $('txtSnd');
  txtSnd.checked = state.txtSnd;
  txtSnd.addEventListener('change', () => { state.txtSnd = txtSnd.checked; store.set('txtsnd', state.txtSnd); });

  /* ----- YES / NO: tap or slide to move the arrow, tap the marked one again to confirm ----- */
  const menu = $('menu');
  const opts = Array.from(menu.querySelectorAll('.opt'));
  function paintSel(){
    opts.forEach((o, k) => o.setAttribute('aria-checked', k === state.sel ? 'true' : 'false'));
  }
  function select(i){
    if (state.sel === i) return false;
    state.sel = i; store.set('sel', i);
    paintSel(); play('move');
    return true;
  }
  function confirmSel(){
    const o = opts[state.sel];
    o.classList.remove('go'); void o.offsetWidth; o.classList.add('go');
    play('ok');
  }
  function optionAt(y){
    const a = opts[0].getBoundingClientRect(), b = opts[1].getBoundingClientRect();
    return y < (a.bottom + b.top) / 2 ? 0 : 1;
  }
  let drag = null;
  menu.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    drag = { id: e.pointerId, y0: e.clientY, was: state.sel, on: optionAt(e.clientY), changed: false, moved: false };
    try { menu.setPointerCapture(e.pointerId); } catch(_){}
    if (select(drag.on)) drag.changed = true;
    e.preventDefault();
  });
  menu.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    if (Math.abs(e.clientY - drag.y0) > 10) drag.moved = true;
    if (select(optionAt(e.clientY))) drag.changed = true;
  });
  menu.addEventListener('pointerup', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const tap = !drag.changed && !drag.moved && drag.on === drag.was;
    drag = null;
    if (tap) confirmSel();
  });
  menu.addEventListener('pointercancel', () => { drag = null; });
  menu.addEventListener('click', e => {           /* keyboard only; touch is handled above */
    if (e.detail !== 0) return;
    const i = opts.indexOf(e.target.closest('.opt'));
    if (i < 0) return;
    if (i === state.sel) confirmSel(); else select(i);
  });
  menu.addEventListener('keydown', e => {
    const to = e.key === 'ArrowUp' || e.key === 'ArrowLeft' ? 0 : e.key === 'ArrowDown' || e.key === 'ArrowRight' ? 1 : -1;
    if (to < 0) return;
    e.preventDefault(); select(to); opts[to].focus();
  });
  opts.forEach(o => o.addEventListener('animationend', () => o.classList.remove('go')));
  paintSel();

  /* ----- sound switch ----- */
  const snd = $('snd');
  function syncSnd(){
    snd.setAttribute('aria-pressed', String(state.sfx > 0));
    snd.textContent = state.sfx ? 'SOM ' + state.sfx : 'SOM OFF';
  }
  snd.addEventListener('click', () => {
    state.sfx = (state.sfx + 1) % (SFX.length + 1); store.set('sfx', state.sfx);
    syncSnd();
    if (state.sfx){ play('move'); setTimeout(() => play('ok'), 260); }
  });
  syncSnd();

  /* ----- backgrounds ----- */
  const bgs = $('bgs');
  BGS.forEach((b, i) => {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'sw';
    btn.setAttribute('aria-label', 'Fundo ' + (i + 1) + ': ' + b.n);
    const cv = document.createElement('canvas'); cv.width = 18; cv.height = 13;
    const g = cv.getContext('2d');
    g.fillStyle = '#303038'; cut(g, 0, 0, 18, 13, 2);
    g.fillStyle = g.createPattern(tile(i), 'repeat'); cut(g, 1, 1, 16, 11, 1);
    btn.appendChild(cv);
    btn.addEventListener('click', () => applyBg(i));
    bgs.appendChild(btn);
  });
  function applyBg(i){
    if (!(i >= 0 && i < BGS.length)) i = 0;
    state.bg = i; store.set('bg', i);
    root.style.setProperty('--tile', 'url(' + tile(i).toDataURL() + ')');
    root.style.setProperty('--grass', BGS[i].base);
    Array.from(bgs.children).forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
  }

  /* ----- border styles ----- */
  const swatches = $('swatches');
  STYLES.forEach((st, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sw';
    b.setAttribute('aria-label', 'Borda ' + (i + 1) + ': ' + st.n);
    const cv = document.createElement('canvas');
    paint(cv, 18, 13, st);
    b.appendChild(cv);
    b.addEventListener('click', () => applyStyle(i));
    swatches.appendChild(b);
  });
  function applyStyle(i){
    state.style = i; store.set('style', i);
    root.style.setProperty('--bw', STYLES[i].r.reduce((a, r) => a + r[1], 0));
    Array.from(swatches.children).forEach((b, k) => b.setAttribute('aria-pressed', k === i ? 'true' : 'false'));
    repaint();
  }

  /* ----- text input and saved lines ----- */
  const msg = $('msg'), chips = $('chips'), save = $('save');
  msg.value = state.text;
  msg.addEventListener('input', () => {
    state.text = msg.value; store.set('text', state.text);
    setText(state.text, false);
  });
  msg.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); msg.blur(); setText(state.text, true); }
  });
  function useText(t){
    state.text = t; msg.value = t; store.set('text', t);
    setText(t, true);
  }
  function renderChips(){
    chips.textContent = '';
    if (!state.phrases.length){
      const h = document.createElement('span');
      h.className = 'hint'; h.textContent = 'Toque em ★ para guardar a fala atual';
      chips.appendChild(h); return;
    }
    state.phrases.forEach((p, i) => {
      const wrap = document.createElement('span'); wrap.className = 'chip';
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip-t'; b.textContent = p;
      b.addEventListener('click', () => useText(p));
      const x = document.createElement('button');
      x.type = 'button'; x.className = 'chip-x'; x.textContent = '×';
      x.setAttribute('aria-label', 'Apagar fala: ' + p);
      x.addEventListener('click', () => { state.phrases.splice(i, 1); store.set('phrases', state.phrases); renderChips(); });
      wrap.append(b, x); chips.appendChild(wrap);
    });
  }
  save.addEventListener('click', () => {
    const t = state.text.trim();
    if (!t) return;
    if (!state.phrases.includes(t)){
      state.phrases.unshift(t);
      state.phrases = state.phrases.slice(0, 24);
      store.set('phrases', state.phrases);
      renderChips();
    }
    save.classList.add('ok'); save.textContent = '✓';
    setTimeout(() => { save.classList.remove('ok'); save.textContent = '★'; }, 900);
  });

  /* ----- help bar open / closed ----- */
  const help = $('help'), helpBody = $('helpBody'), toggle = $('toggle');
  function setOpen(o){
    state.open = o; store.set('open', o);
    help.dataset.open = String(o);
    helpBody.hidden = !o;
    toggle.setAttribute('aria-expanded', String(o));
  }
  toggle.addEventListener('click', () => setOpen(!state.open));

  /* ----- full screen (browser tab only; the installed app already opens full screen) ----- */
  const fs = $('fs');
  const installed = (window.matchMedia && (matchMedia('(display-mode: fullscreen)').matches || matchMedia('(display-mode: standalone)').matches)) || navigator.standalone === true;
  function syncFs(){ fs.hidden = !(document.fullscreenEnabled && !installed && !document.fullscreenElement); }
  fs.addEventListener('click', () => {
    try { document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); } catch(e){}
  });
  document.addEventListener('fullscreenchange', syncFs);
  syncFs();

  /* ----- keep the screen awake while it is on show ----- */
  let lock = null;
  async function wake(){
    try {
      if ('wakeLock' in navigator && document.visibilityState === 'visible' && !lock){
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      }
    } catch(e){}
  }
  document.addEventListener('visibilitychange', wake);
  document.addEventListener('pointerdown', wake, { passive: true });

  /* ----- start ----- */
  renderChips();
  setOpen(state.open);
  applyBg(state.bg);
  applyStyle(state.style);
  fit();
  setText(state.text, true);
  wake();

  let raf = 0;
  const ro = new ResizeObserver(() => { cancelAnimationFrame(raf); raf = requestAnimationFrame(fit); });
  ro.observe(stage);
  new ResizeObserver(() => requestAnimationFrame(repaint)).observe(dialog);
  window.addEventListener('orientationchange', () => setTimeout(fit, 250));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(repaint);
})();
</script>
